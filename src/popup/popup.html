<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Response Collector</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Response Collector</h1>
      <dl class="counts" aria-label="Sample counts">
        <div><dt>Total</dt><dd id="total-count">0</dd></div>
        <div><dt>Positive</dt><dd id="positive-count">0</dd></div>
        <div><dt>Negative</dt><dd id="negative-count">0</dd></div>
      </dl>
      <button id="export-button" type="button">Export JSONL</button>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="../storage.js"></script>
    <script src="../export-jsonl.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
